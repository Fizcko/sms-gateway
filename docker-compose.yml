services:
  db:
    image: mariadb:11.4-ubi
    container_name: sms-gateway_db
    restart: always
    command: --wait_timeout=28800 --interactive_timeout=28800
    volumes:
      - /opt/mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set it in .env}
      - MYSQL_USER=sms-gateway
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set it in .env}
      - MYSQL_DATABASE=smsd
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    image: fizcko/sms-gateway:latest
    build: .
    container_name: sms-gateway_server
    restart: always
    ports:
      - 5000:5000
    devices:
      - "${MODEM_DEVICE:-/dev/ttyUSB2}:/dev/phone"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=sms-gateway
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set it in .env}
      - MYSQL_DATABASE=smsd
      - GAMMU_DEVICE=/dev/phone
      - GAMMU_PIN=${GAMMU_PIN:-1234}
      - API_SECURITY=${API_SECURITY:-None}
      - API_USERNAME=${API_USERNAME:-}
      - API_PASSWORD=${API_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/healthz || exit 1"]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3
