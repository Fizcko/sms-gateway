build:
    tags:
      - docker
    stage: build
    only:
      - tags
    image: docker:29
    services:
      - name: docker:29-dind
    before_script:
      - docker --version
      - docker buildx version
      - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
      - echo $IMAGE_NAME:$CI_COMMIT_TAG
      - echo "APP_VERSION=$CI_COMMIT_TAG"
    script:
      - |-
          docker buildx create --use
          docker buildx ls
          # No tag latest for '-rc' tags
          if echo "$CI_COMMIT_TAG" | grep "\-rc"; then
            docker buildx build --push --target final --build-arg APP_VERSION=$CI_COMMIT_TAG -t $IMAGE_NAME:$CI_COMMIT_TAG --platform linux/amd64,linux/arm64 .
          else
            docker buildx build --push --target final --build-arg APP_VERSION=$CI_COMMIT_TAG -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_TAG --platform linux/amd64,linux/arm64 .
          fi
    after_script:
      - docker buildx stop